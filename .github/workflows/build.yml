name: Build Images

on:
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch:

jobs:
  build:
    # Native arm64 runner: no qemu, and the chroot steps (apt, grub-install, initramfs) run at full speed.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        profile: [nova-bookworm, nova-trixie, nova-resolute]
    steps:
      - name: Checkout Images
        uses: actions/checkout@v4
        with:
          path: images

      - name: Checkout imageforge
        uses: actions/checkout@v4
        with:
          repository: ameriDroid/imageforge
          path: imageforge

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap parted jq btrfs-progs wget unzip multipath-tools dosfstools \
            arch-install-scripts debian-archive-keyring ubuntu-keyring git gdisk rsync xz-utils python3-setuptools
          # Ubuntu's debian-archive-keyring predates trixie; take the current keyring from Debian
          wget -q https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb
          sudo dpkg -i debian-archive-keyring_2025.1_all.deb
          sudo pip3 install --break-system-packages ./imageforge

      - name: Build ${{ matrix.profile }}
        run: |
          sudo umount -R ./work/arm64/* ./work/mnt 2>/dev/null || true
          for i in 1 2 3; do
            sudo python3 "$GITHUB_WORKSPACE/images/${{ matrix.profile }}/profiledef" -c "$GITHUB_WORKSPACE/images/${{ matrix.profile }}" -w "$GITHUB_WORKSPACE/work" -o "$GITHUB_WORKSPACE/out" && break
            sudo umount -R ./work/arm64/* ./work/mnt 2>/dev/null || true
          done
          ls ./out/*.img.xz

      - name: Cleanup
        if: always()
        run: |
          sudo umount -R ./work/arm64/* ./work/mnt 2>/dev/null || true
          sudo rm -rf ./work

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}
          path: ./out/*.img.xz
          compression-level: 0
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          path: ./out
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(date +'%Y-%m-%d')
          {
            echo '| Image | Base | Kernel | Login (user / password) |'
            echo '|---|---|---|---|'
            for f in ./out/*.img.xz; do
              n=$(basename "$f")
              case "$n" in
                Ubuntu2604-*) row='Ubuntu 26.04 | 7.0 generic | `ubuntu` / `ubuntu`' ;;
                Debian13-*)   row='Debian 13 | 7.x trixie-backports | `debian` / `debian`' ;;
                Debian-*)     row='Debian 12 | 6.1 rockchip | `debian` / `debian`' ;;
                *)            row='? | ? | ?' ;;
              esac
              echo "| \`$n\` | $row |"
            done
            echo
            echo 'sha256:'
            echo '```'
            (cd ./out && sha256sum *.img.xz)
            echo '```'
          } > notes.md
          gh release create "$tag" ./out/*.img.xz --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file notes.md
